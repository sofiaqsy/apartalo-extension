<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>BCP → Apartalo</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <header>
    <span class="logo">BCP <span class="arrow">→</span> Apartalo</span>
  </header>

  <!-- Sesión de fincas: la única configuración (General Manager, 5 nov 2026: sin campos que no hacen falta) -->
  <div id="session">
    <span id="fincasUser">Sin sesión</span>
    <button id="btnFincasSignIn" type="button" class="btn-primary btn-small hidden">Iniciar sesión con Google</button>
    <button id="btnFincasSignOut" type="button" class="btn-link hidden">Salir</button>
  </div>

  <!-- Drop zone -->
  <div id="dropZone">
    <div class="drop-icon">📄</div>
    <p>Arrastra tu archivo<br><strong>Corriente Soles.xlsx</strong><br>o haz clic para seleccionar</p>
    <input id="fileInput" type="file" accept=".xlsx,.xls" />
  </div>

  <!-- Status -->
  <div id="status" class="hidden"></div>

  <p id="hint" class="muted">Las líneas se guardan en fincas. Se concilian en la app: Finanzas → Movimientos.</p>

  <script src="lib/xlsx.full.min.js"></script>
  <script src="fincas-config.js"></script>
  <script src="fincas.js"></script>
  <script src="popup.js"></script>
</body>
</html>
